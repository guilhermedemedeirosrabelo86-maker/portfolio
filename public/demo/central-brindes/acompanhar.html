<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#D61C38">
<link rel="icon" href="assets/simbolo.svg">
<title>Acompanhe seu envio · Empresa Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/styles.css">
<style>
  /* Página pública de acompanhamento (o representante abre pelo link) */
  .pub{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:calc(20px + env(safe-area-inset-top,0px)) 40px;display:flex;flex-direction:column;gap:16px}
  #pubRoot{display:flex;flex-direction:column;gap:14px}
  .pub-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 6px}
  .pub-top img{height:40px;width:auto;display:block}
  .pub-top span{font-size:12.5px;font-weight:700;color:var(--muted);text-align:right;line-height:1.3}
  .hero-st{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:22px 22px 20px;color:#fff;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh-2)}
  .hero-st::after{content:"";position:absolute;right:-50px;bottom:-70px;width:220px;height:160px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.22),transparent);pointer-events:none}
  .hero-st .ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:rgba(255,255,255,.18);margin-bottom:6px}
  .hero-st .ico svg{width:24px;height:24px}
  .hero-st small{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
  .hero-st h1{color:#fff;font-size:26px;line-height:1.15}
  .hero-st p{font-size:15px;opacity:.92}
  .h-wait{background:linear-gradient(135deg,#F59E0B,#D97706)}
  .h-go{background:linear-gradient(135deg,#3B82F6,#1D4ED8)}
  .h-ok{background:linear-gradient(135deg,#22A05B,#15803D)}
  .h-bad{background:linear-gradient(135deg,#E11D48,#B3142C)}
  .h-off{background:linear-gradient(135deg,#6B7280,#4B5563)}
  .pub .card{padding:18px}
  .pub h2{font-size:16px;margin-bottom:12px}
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;position:relative}
  .steps .s{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative}
  .steps .s::before{content:"";position:absolute;top:13px;right:50%;width:100%;height:3px;background:var(--line-2);z-index:0}
  .steps .s:first-child::before{display:none}
  .steps .s.done::before{background:var(--ok-dot)}
  .steps .d{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:3px solid var(--line-2);color:transparent}
  .steps .d svg{width:14px;height:14px}
  .steps .done .d{background:var(--ok-dot);border-color:var(--ok-dot);color:#fff}
  .steps .now .d{border-color:var(--primary);box-shadow:0 0 0 5px var(--primary-50)}
  .steps b{font-size:12.5px;font-weight:800;color:var(--muted)}
  .steps .done b{color:var(--ink)}
  .steps small{font-size:11.5px;color:var(--faint);min-height:14px}
  .trk-pub{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
  .trk-pub .c small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .trk-pub .c b{font-family:var(--f-mono);font-size:19px;letter-spacing:.05em;user-select:all}
  .trk-pub .btns a{text-decoration:none}
  .rec{display:flex;gap:12px;align-items:flex-start}
  .rec .ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
  .rec .ico svg{width:20px;height:20px}
  .rec b{display:block;font-size:16px}
  .rec small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
  .rec-ok .ico{background:var(--ok-bg);color:var(--ok)}
  .rec-prob .ico{background:var(--pend-bg);color:var(--pend)}
  .rec-ask{border:1.5px solid color-mix(in srgb,var(--ok) 35%,var(--line))}
  .rec-ask h2{margin:0 0 4px}
  .rec-bts{display:flex;flex-wrap:wrap;gap:8px}
  .rec-bts .btn{flex:1 1 200px;height:46px}
  .rec-bts svg,.rec-ask .btn svg{width:18px;height:18px}
  #recProbBox{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  #recProbBox[hidden]{display:none}
  .trk-pub + .trk-pub{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  .items{display:flex;flex-direction:column}
  .items div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
  .items div:first-child{border-top:0;padding-top:0}
  .items b{font-weight:800;white-space:nowrap}
  .tl{display:flex;flex-direction:column}
  .tl .e{display:grid;grid-template-columns:18px 1fr;gap:12px;padding-bottom:16px;position:relative}
  .tl .e:not(:last-child)::before{content:"";position:absolute;left:8px;top:20px;bottom:0;width:2px;background:var(--line)}
  .tl .dot{width:18px;height:18px;border-radius:50%;background:var(--surface-3);border:3px solid var(--line-2);margin-top:2px}
  .tl .e:first-child .dot{background:var(--primary);border-color:var(--primary-100)}
  .tl b{display:block;font-size:14.5px}
  .tl span{font-size:13px;color:var(--muted)}
  .pub-foot{text-align:center;font-size:12.5px;color:var(--faint);padding-top:6px}
  .live{display:inline-flex;align-items:center;gap:6px}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--ok-dot);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok-dot) 25%,transparent)}
  .msg-box{text-align:center;padding:40px 20px}
  .msg-box .ico{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;margin:0 auto 14px;background:var(--surface-3);color:var(--muted)}
  .msg-box .ico svg{width:28px;height:28px}
  .msg-box p{color:var(--muted);margin-top:6px}
  @media (max-width:420px){.steps b{font-size:11.5px}.hero-st h1{font-size:23px}}
</style>
</head>
<body>
<main class="pub">
  <header class="pub-top">
    <picture>
      <source srcset="assets/logo-branca.svg" media="(prefers-color-scheme: dark)">
      <img src="assets/logo.svg" alt="Empresa Demo">
    </picture>
    <span>Marketing<br>Acompanhamento de envio</span>
  </header>
  <div id="pubRoot"><div class="card msg-box"><div class="g-spin" aria-hidden="true"></div><p>Carregando seu envio…</p></div></div>
  <footer class="pub-foot">Empresa Demo · Marketing · Esta página se atualiza sozinha</footer>
</main>

<!-- DEMO: Firebase falso (tudo fica no seu navegador) + dados fictícios -->
<script src="js/demo-seed.js"></script>
<script src="js/firebase-demo.js"></script>
<script src="js/acompanhar.js"></script>
</body>
</html>
